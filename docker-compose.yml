services:
  postgres:
    image: postgres:16-alpine
    container_name: ordered-postgres
    environment:
      POSTGRES_DB: ordered
      POSTGRES_USER: ordered
      POSTGRES_PASSWORD: ordered
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordered"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: