services:
  postgres:
    image: postgres:16-alpine
    container_name: ordered-postgres
    environment:
      POSTGRES_DB: ordered
      POSTGRES_USER: ordered
      POSTGRES_PASSWORD: ordered
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordered"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ordered-backend
    profiles: [ "full" ]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/ordered
      DB_USERNAME: ordered
      DB_PASSWORD: ordered

volumes:
  postgres_data: