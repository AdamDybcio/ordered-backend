spring:
  application:
    name: ordered-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordered}
    username: ${DB_USERNAME:ordered}
    password: ${DB_PASSWORD:ordered}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: ${SERVER_PORT:9090}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-min-256-bits-long-please-replace}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}