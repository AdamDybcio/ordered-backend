spring:
  application:
    name: ordered-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordered}
    username: ${DB_USERNAME:ordered}
    password: ${DB_PASSWORD:ordered}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ordered-backend
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/ordered}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

server:
  port: ${PORT:9090}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-min-256-bits-long-please-replace}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:9090
  outbox:
    poll-interval-ms: 5000

stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}

resilience4j:
  circuitbreaker:
    instances:
      stripePayments:
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      stripePayments:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - pl.dybcio.ordered.payment.service.PaymentProcessingException